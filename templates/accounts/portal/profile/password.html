{% extends 'accounts/portal/layouts/portal_base.html' %}
{% block title %}Change password · Skin Sensation{% endblock %}
{% block portal_content %}

    <h1 class="portal-title">Change password</h1>
    <p class="portal-subtitle">Use our secure password change form.</p>
  </header>
  <section class="portal-actions">

  </section>

{% endblock %}
