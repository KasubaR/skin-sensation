{% if page_obj.has_other_pages %}
<nav class="dash-pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
  <a class="dash-btn dash-btn--secondary" href="?page={{ page_obj.previous_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}">Previous</a>
  {% endif %}
  <span class="dash-pagination__info">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a class="dash-btn dash-btn--secondary" href="?page={{ page_obj.next_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}">Next</a>
  {% endif %}
</nav>
{% endif %}
