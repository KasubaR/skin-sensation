<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Appointment rescheduled</title></head>
<body style="font-family: Georgia, serif; color: #2c2c2c; line-height: 1.6; max-width: 560px; margin: 0 auto; padding: 24px;">
  <p>Hi {{ customer_name }},</p>
  <p>Your appointment <strong>{{ booking_reference }}</strong> has been rescheduled.</p>
  <p><strong>New time:</strong> {{ appointment_date|date:"l, j F Y" }} · {{ start_time|time:"g:i A" }} – {{ end_time|time:"g:i A" }}<br>
  <strong>Therapist:</strong> {{ staff_name|default:"To be assigned" }}</p>
  <p><a href="{{ appointment_url }}">View appointment details</a></p>
  <p style="color: #666;">Skin Sensation Spa</p>
</body>
</html>
