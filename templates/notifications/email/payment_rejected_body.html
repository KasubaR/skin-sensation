<!DOCTYPE html>
<html lang="en">
<body style="font-family: Georgia, serif; color: #2c2c2c; max-width: 560px; margin: 0 auto; padding: 24px;">
  <p>Hi {{ customer_name }},</p>
  <p>We could not verify your payment of <strong>K{{ payment_amount }}</strong> for booking <code>{{ booking_reference }}</code>.</p>
  {% if rejection_reason %}<p><strong>Reason:</strong> {{ rejection_reason }}</p>{% endif %}
  <p>Please submit updated proof from your account.</p>
  <p><a href="{{ appointment_url }}">View your appointment</a></p>
  <p style="color: #666;">Skin Sensation Spa</p>
</body>
</html>
