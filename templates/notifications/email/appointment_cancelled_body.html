<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Appointment cancelled</title></head>
<body style="font-family: Georgia, serif; color: #2c2c2c; line-height: 1.6; max-width: 560px; margin: 0 auto; padding: 24px;">
  <p>Hi {{ customer_name }},</p>
  <p>Your appointment <strong>{{ booking_reference }}</strong> on {{ appointment_date|date:"l, j F Y" }} at {{ start_time|time:"g:i A" }} has been cancelled.</p>
  <p><a href="{{ appointment_url }}">View your appointments</a></p>
  <p>Questions? Call <a href="tel:{{ spa_phone }}">{{ spa_phone }}</a> or <a href="{{ spa_whatsapp_url }}">WhatsApp</a>.</p>
  <p style="color: #666;">Skin Sensation Spa</p>
</body>
</html>
